<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Quiz Game Form</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #46178f; color: white; text-align: center; margin: 0; padding: 20px; }
        .hidden { display: none; }
        .btn { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 10px; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-add { background: #00c853; color: white; }
        .btn-host { background: #ff9100; color: white; display: block; margin: 20px auto; width: 200px; font-size: 18px; }
        .btn-join { background: #00b0ff; color: white; }
        .btn-remove { background: #d50000; color: white; padding: 8px 12px; margin-left: 10px; border-radius: 4px; border: none; cursor: pointer; }
        
        .question-form-container { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; max-width: 650px; margin: 20px auto; text-align: left; }
        .question-row { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #ff9100; position: relative; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 4px; color: #ddd; }
        .form-input { width: 100%; padding: 8px; border: 1px solid #673ab7; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .row-header h4 { margin: 0; color: #ffdd00; }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .red { background: #e21b3c; color: white; }
        .blue { background: #1368ce; color: white; }
        .yellow { background: #d89e00; color: white; }
        .green { background: #26890c; color: white; }
        ul { list-style: none; padding: 0; font-size: 20px; }
        input[type="text"]#game-pin { padding: 12px; font-size: 16px; width: 250px; border-radius: 8px; border: none; text-align: center; }
    </style>
</head>
<body>

    <!-- SETUP SCREEN WITH DYNAMIC FORM -->
    <div id="setup-screen">
        <h1>P2P Quiz Game Builder</h1>
        
        <div class="question-form-container">
            <h2>1. Create Your Questions</h2>
            <div id="questions-list">
                <!-- Row 1 Default -->
                <div class="question-row">
                    <div class="row-header">
                        <h4>Question 1</h4>
                        <button type="button" class="btn-remove" onclick="removeRow(this)">Delete</button>
                    </div>
                    <div class="form-group">
                        <label>Question Prompt</label>
                        <input type="text" class="q-text form-input" placeholder="e.g., What is the capital of England?" required value="What language runs in a web browser?">
                    </div>
                    <div class="options-grid">
                        <div>
                            <label>Option A (Red Triangle ▲)</label>
                            <input type="text" class="opt-a form-input" placeholder="Answer A" required value="JavaScript">
                        </div>
                        <div>
                            <label>Option B (Blue Diamond ◆)</label>
                            <input type="text" class="opt-b form-input" placeholder="Answer B" required value="Python">
                        </div>
                        <div>
                            <label>Option C (Yellow Circle ●)</label>
                            <input type="text" class="opt-c form-input" placeholder="Answer C" required value="HTML">
                        </div>
                        <div>
                            <label>Option D (Green Square ■)</label>
                            <input type="text" class="opt-d form-input" placeholder="Answer D" required value="C++">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Correct Choice</label>
                        <select class="q-correct form-input" style="width: auto;">
                            <option value="A">Option A (Red)</option>
                            <option value="B">Option B (Blue)</option>
                            <option value="C">Option C (Yellow)</option>
                            <option value="D">Option D (Green)</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-add" onclick="addQuestionRow()">➕ Add Another Question</button>
            <button class="btn btn-host" onclick="startAsHost()">Host Game 🚀</button>
        </div>

        <hr style="width: 50%; margin: 30px auto; opacity: 0.3;">
        
        <h2>Or Join an Existing Lobby</h2>
        <input type="text" id="game-pin" placeholder="Enter Host PIN Code">
        <br>
        <button class="btn btn-join" onclick="startAsPlayer()">Join Lobby 🎮</button>
    </div>

    <!-- HOST INTERFACE -->
    <div id="host-view" class="hidden">
        <h2>Lobby PIN (Share this with players): <span id="display-pin" style="color: #ffdd00; font-size: 28px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 6px; letter-spacing: 1px;">Generating...</span></h2>
        <div id="host-lobby">
            <h3>Connected Players:</h3>
            <ul id="player-list"></ul>
            <button class="btn green" id="start-game-btn" onclick="sendStartGame()" style="font-size: 20px; padding: 15px 40px;" disabled>Start Match</button>
        </div>
        <div id="host-game" class="hidden">
            <h1 id="question-text" style="font-size: 36px; margin-top: 40px;">Question text loading...</h1>
            <h3 style="background: rgba(0,0,0,0.2); display: inline-block; padding: 10px 20px; border-radius: 20px;">Submissions Received: <span id="submission-count">0</span></h3>
        </div>
    </div>

    <!-- PLAYER INTERFACE -->
    <div id="player-view" class="hidden">
        <h2 id="player-status" style="font-size: 24px; margin-top: 40px;">Connecting...</h2>
        <div id="player-controller" class="hidden">
            <div class="answers-grid">
                <button class="btn red" onclick="submitAnswer('A')" style="font-size: 40px; height: 120px;">▲</button>
                <button class="btn blue" onclick="submitAnswer('B')" style="font-size: 40px; height: 120px;">◆</button>
                <button class="btn yellow" onclick="submitAnswer('C')" style="font-size: 40px; height: 120px;">●</button>
                <button class="btn green" onclick="submitAnswer('D')" style="font-size: 40px; height: 120px;">■</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
